name: Bootstrap ForgeManager Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-forgemanager-source
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.part00
          cat .bootstrap/source.part* > /tmp/forgemanager-source.b64
          base64 --decode /tmp/forgemanager-source.b64 > /tmp/forgemanager-source.tar.xz
          echo "0c64a72f6e144f18cae617a50f3147f3566f138b90d6da09ad9796a6397a4f56  /tmp/forgemanager-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/forgemanager-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit full source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Import ForgeManager 0.3.1 modern source"
          git push origin HEAD:main

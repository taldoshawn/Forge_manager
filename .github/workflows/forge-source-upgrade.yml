name: Forge Manager source upgrade

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/forge-source-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source integrations
        run: |
          set -euo pipefail
          python3 .github/scripts/forge_upgrade.py
          git diff --check

      - name: Commit source integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/forgemanager/app/MainActivity.kt app/src/main/java/com/forgemanager/app/features/editor/TextEditorActivity.kt app/src/main/java/com/forgemanager/app/features/editor/SyntaxHighlighter.kt
          git commit -m "Integrate rich viewers editor terminal and navigation"
          git push origin HEAD:main

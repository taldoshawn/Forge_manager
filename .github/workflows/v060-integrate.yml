name: V060 integrate

on:
  push:
    branches: [ v060-ui-formats ]

permissions:
  contents: write

concurrency:
  group: v060-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v060-ui-formats
      - name: Apply source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v060_patch.py
          rm -rf .v060-assets
          git diff --check
          git config user.name "Forge Manager CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/forgemanager/app/MainActivity.kt .v060-assets tools/v060_patch.py
          git rm --cached tools/v060_patch.py
          rm -f tools/v060_patch.py
          if git diff --cached --quiet; then
            echo "Nothing to integrate"
            exit 0
          fi
          git commit -m "Integrate v0.6 settings and advanced format actions"
          git push origin HEAD:v060-ui-formats

name: Repair SAF bookmark model reference

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-saf-bookmarks.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix nested SafParent reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/forgemanager/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = 'com.forgemanager.app.core.file.SafParent'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 obsolete SafParent references, found {count}')
          path.write_text(text.replace(old, 'FileLocation.SafParent'), encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/forgemanager/app/MainActivity.kt
          git commit -m "Fix SAF bookmark parent model reference"
          git push origin HEAD:main

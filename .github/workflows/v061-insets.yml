name: V061 insets migration

on:
  push:
    branches: [ v061-core-evolution ]

permissions:
  contents: write

concurrency:
  group: v061-insets
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-core-evolution
      - name: Migrate tool activities
        run: |
          set -euo pipefail
          python3 tools/v061_patch_insets.py
          git diff --check
          git config user.name "Forge Manager CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/forgemanager/app/features
          git rm tools/v061_patch_insets.py .github/workflows/v061-insets.yml
          git commit -m "Apply safe insets to internal tool activities"
          git push origin HEAD:v061-core-evolution

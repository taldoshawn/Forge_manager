name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Test + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat .forge/source.b64.part* | base64 --decode > /tmp/ForgeManager-source-full.tar.xz
          echo "570fa15d36af796a8fa47c6df45aefa22b692a32e2e39ce676e8befc081d9580  /tmp/ForgeManager-source-full.tar.xz" | sha256sum -c -
          mkdir -p ci-src
          tar -xJf /tmp/ForgeManager-source-full.tar.xz -C ci-src
          mkdir -p ci-src/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar ci-src/gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Test and build debug APK
        working-directory: ci-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ForgeManager-debug-${{ github.sha }}
          path: ci-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ForgeManager-test-report-${{ github.sha }}
          path: ci-src/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

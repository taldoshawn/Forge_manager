name: V061 build probe

on:
  push:
    branches: [ v061-core-evolution ]
    paths: [ '.github/workflows/v061-build-probe.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Test + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-core-evolution
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK 37 + NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Test and build
        run: gradle --no-daemon --stacktrace --warning-mode all testDebugUnitTest assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ForgeManager-v061-probe-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: V061 integrate open-as

on:
  push:
    branches: [ v061-core-evolution ]
    paths: [ '.github/workflows/v061-integrate-openas.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-core-evolution
          fetch-depth: 0
      - name: Apply integration patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          te=Path('app/src/main/java/com/forgemanager/app/features/editor/TextEditorActivity.kt')
          s=te.read_text()
          if 'private var languageOverride:' not in s:
              s=s.replace('    private lateinit var profile: EditorProfile\n', '    private lateinit var profile: EditorProfile\n    private var languageOverride: EditorLanguage? = null\n', 1)
          if 'intent.getStringExtra(EXTRA_LANGUAGE_OVERRIDE)' not in s:
              s=s.replace(
                  '        profile = EditorProfile.forFile(displayName)\n        setContentView(buildUi())',
                  '        languageOverride = intent.getStringExtra(EXTRA_LANGUAGE_OVERRIDE)?.let { raw ->\n            runCatching { EditorLanguage.valueOf(raw) }.getOrNull()\n        }\n        profile = languageOverride?.let(EditorProfile::forLanguage) ?: EditorProfile.forFile(displayName)\n        setContentView(buildUi())', 1)
          s=s.replace('SyntaxHighlighter.applyChanged(editor.text, displayName, from, to)', 'SyntaxHighlighter.applyChanged(editor.text, highlightName(), from, to)')
          s=s.replace('SyntaxHighlighter.apply(editor.text, displayName)', 'SyntaxHighlighter.apply(editor.text, highlightName())')
          if 'displayName = newName\n                        languageOverride = null' not in s:
              s=s.replace('displayName = newName\n                        profile = EditorProfile.forFile(displayName)', 'displayName = newName\n                        languageOverride = null\n                        profile = EditorProfile.forFile(displayName)', 1)
          if 'private fun highlightName()' not in s:
              s=s.replace('    private fun scheduleHighlight() {', '    private fun highlightName(): String = languageOverride?.let { "file.${EditorProfile.extensionFor(it)}" } ?: displayName\n\n    private fun scheduleHighlight() {', 1)
          if 'EXTRA_LANGUAGE_OVERRIDE' not in s.split('companion object',1)[-1]:
              s=s.replace('    companion object {\n        private const val MAX_NORMAL_EDIT_BYTES', '    companion object {\n        const val EXTRA_LANGUAGE_OVERRIDE = "editor_language_override"\n        private const val MAX_NORMAL_EDIT_BYTES', 1)
          te.write_text(s)
          assert 'const val EXTRA_LANGUAGE_OVERRIDE' in s
          assert 'SyntaxHighlighter.applyChanged(editor.text, highlightName()' in s

          ma=Path('app/src/main/java/com/forgemanager/app/MainActivity.kt')
          s=ma.read_text()
          if 'import com.forgemanager.app.features.explorer.OpenAsController' not in s:
              s=s.replace('import com.forgemanager.app.features.explorer.FileListAdapter\n', 'import com.forgemanager.app.features.explorer.FileListAdapter\nimport com.forgemanager.app.features.explorer.OpenAsController\n', 1)
          if 'leftUi.adapter.release()' not in s:
              s=s.replace('        operationJob?.cancel()\n        scope.cancel()', '        operationJob?.cancel()\n        if (::leftUi.isInitialized) leftUi.adapter.release()\n        if (::rightUi.isInitialized) rightUi.adapter.release()\n        scope.cancel()', 1)
          if '            "Abrir como…",' not in s:
              s=s.replace('            "Abrir com",\n            "Visualizar",', '            "Abrir com",\n            "Abrir como…",\n            "Visualizar",', 1)
          if '"Abrir como…" -> items.singleOrNull()' not in s:
              s=s.replace('                "Abrir com" -> openWith(items.singleOrNull())\n                "Visualizar" ->', '                "Abrir com" -> openWith(items.singleOrNull())\n                "Abrir como…" -> items.singleOrNull()?.let(::showOpenAs) ?: toast("Selecione um arquivo")\n                "Visualizar" ->', 1)
          generic='''            FileKind.GENERIC -> {\n                AlertDialog.Builder(this).setTitle(node.name)\n                    .setItems(arrayOf("Editar como texto", "Editor hexadecimal", "Abrir com…")) { _, which ->\n                        when (which) {\n                            0 -> openTextEditor(node)\n                            1 -> openHexEditor(node)\n                            2 -> openWith(node)\n                        }\n                    }.show()\n            }'''
          if generic in s:
              s=s.replace(generic, '            FileKind.GENERIC -> showOpenAs(node)', 1)
          if 'private fun showOpenAs(node: FileNode)' not in s:
              marker='    private fun showTextHexOpenDialog(node: FileNode) {'
              method='''    private fun showOpenAs(node: FileNode) {\n        OpenAsController.show(\n            activity = this,\n            node = node,\n            navigateArchive = { navigate(controller.activePane, it) },\n            openAutomatic = ::openInternalViewer,\n            openExternal = { openWith(it) }\n        )\n    }\n\n'''
              s=s.replace(marker, method+marker, 1)
          ma.write_text(s)
          assert 'private fun showOpenAs(node: FileNode)' in s
          assert 'FileKind.GENERIC -> showOpenAs(node)' in s
          assert 'leftUi.adapter.release()' in s

          ar=Path('app/src/main/java/com/forgemanager/app/archive/ArchiveFileBackend.kt')
          s=ar.read_text()
          s=s.replace('''                    }\n                    raw.fd.sync()\n                }\n            }\n            // Re-open the produced ZIP''', '''                    }\n                }\n            }\n            FileOutputStream(temporary, true).use { it.fd.sync() }\n            // Re-open the produced ZIP''', 1)
          ar.write_text(s)
          assert 'FileOutputStream(temporary, true).use { it.fd.sync() }' in s
          PY
      - name: Commit source patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Forge Manager CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/forgemanager/app/MainActivity.kt \
                  app/src/main/java/com/forgemanager/app/features/editor/TextEditorActivity.kt \
                  app/src/main/java/com/forgemanager/app/archive/ArchiveFileBackend.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Complete Open As integration and lifecycle fixes'
            git push origin HEAD:v061-core-evolution
          fi

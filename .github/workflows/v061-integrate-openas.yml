name: V061 integrate open-as

on:
  push:
    branches: [ v061-core-evolution ]
    paths: [ '.github/workflows/v061-integrate-openas.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-core-evolution
          fetch-depth: 0
      - name: Apply integration patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          te='app/src/main/java/com/forgemanager/app/features/editor/TextEditorActivity.kt'
          replace_once(te,
              '    private lateinit var profile: EditorProfile\n',
              '    private lateinit var profile: EditorProfile\n    private var languageOverride: EditorLanguage? = null\n')
          replace_once(te,
              '        profile = EditorProfile.forFile(displayName)\n        setContentView(buildUi())',
              '        languageOverride = intent.getStringExtra(EXTRA_LANGUAGE_OVERRIDE)?.let { raw ->\n            runCatching { EditorLanguage.valueOf(raw) }.getOrNull()\n        }\n        profile = languageOverride?.let(EditorProfile::forLanguage) ?: EditorProfile.forFile(displayName)\n        setContentView(buildUi())')
          p=Path(te); s=p.read_text()
          s=s.replace('SyntaxHighlighter.applyChanged(editor.text, displayName, from, to)', 'SyntaxHighlighter.applyChanged(editor.text, highlightName(), from, to)')
          s=s.replace('SyntaxHighlighter.apply(editor.text, displayName)', 'SyntaxHighlighter.apply(editor.text, highlightName())')
          p.write_text(s)
          replace_once(te,
              '                        displayName = newName\n                        profile = EditorProfile.forFile(displayName)',
              '                        displayName = newName\n                        languageOverride = null\n                        profile = EditorProfile.forFile(displayName)')
          replace_once(te,
              '    private fun scheduleHighlight() {\n',
              '    private fun highlightName(): String = languageOverride?.let { "file.${EditorProfile.extensionFor(it)}" } ?: displayName\n\n    private fun scheduleHighlight() {\n')
          replace_once(te,
              '    companion object {\n        private const val MAX_NORMAL_EDIT_BYTES',
              '    companion object {\n        const val EXTRA_LANGUAGE_OVERRIDE = "editor_language_override"\n        private const val MAX_NORMAL_EDIT_BYTES')

          ma='app/src/main/java/com/forgemanager/app/MainActivity.kt'
          replace_once(ma,
              'import com.forgemanager.app.features.explorer.FileListAdapter\n',
              'import com.forgemanager.app.features.explorer.FileListAdapter\nimport com.forgemanager.app.features.explorer.OpenAsController\n')
          replace_once(ma,
              '        operationJob?.cancel()\n        scope.cancel()',
              '        operationJob?.cancel()\n        if (::leftUi.isInitialized) leftUi.adapter.release()\n        if (::rightUi.isInitialized) rightUi.adapter.release()\n        scope.cancel()')
          replace_once(ma,
              '            "Abrir com",\n            "Visualizar",',
              '            "Abrir com",\n            "Abrir como…",\n            "Visualizar",')
          replace_once(ma,
              '                "Abrir com" -> openWith(items.singleOrNull())\n                "Visualizar" ->',
              '                "Abrir com" -> openWith(items.singleOrNull())\n                "Abrir como…" -> items.singleOrNull()?.let(::showOpenAs) ?: toast("Selecione um arquivo")\n                "Visualizar" ->')
          old='''            FileKind.GENERIC -> {\n                AlertDialog.Builder(this).setTitle(node.name)\n                    .setItems(arrayOf("Editar como texto", "Editor hexadecimal", "Abrir com…")) { _, which ->\n                        when (which) {\n                            0 -> openTextEditor(node)\n                            1 -> openHexEditor(node)\n                            2 -> openWith(node)\n                        }\n                    }.show()\n            }'''
          new='''            FileKind.GENERIC -> showOpenAs(node)'''
          replace_once(ma, old, new)
          replace_once(ma,
              '    private fun showTextHexOpenDialog(node: FileNode) {\n',
              '    private fun showOpenAs(node: FileNode) {\n        OpenAsController.show(\n            activity = this,\n            node = node,\n            navigateArchive = { navigate(controller.activePane, it) },\n            openAutomatic = ::openInternalViewer,\n            openExternal = { openWith(it) }\n        )\n    }\n\n    private fun showTextHexOpenDialog(node: FileNode) {\n')

          ar='app/src/main/java/com/forgemanager/app/archive/ArchiveFileBackend.kt'
          replace_once(ar,
              '''                    }\n                    raw.fd.sync()\n                }\n            }\n            // Re-open the produced ZIP''',
              '''                    }\n                }\n            }\n            FileOutputStream(temporary, true).use { it.fd.sync() }\n            // Re-open the produced ZIP''')

          wf=Path('.github/workflows/v061-integrate-openas.yml')
          wf.unlink()
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Forge Manager CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Open As integration and lifecycle fixes'
          git push origin HEAD:v061-core-evolution

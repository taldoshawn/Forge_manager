plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.forgemanager.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.forgemanager.app'
        minSdk = 26
        targetSdk = 37
        versionCode = 7
        versionName = '0.5.0'
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'

        externalNativeBuild {
            cmake {
                cFlags '-std=c11 -Wall -Wextra'
            }
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    ndkVersion '28.2.13676358'

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'com.android.tools.smali:smali:3.0.10'
    implementation 'com.android.tools.smali:smali-baksmali:3.0.10'
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.10'
    implementation 'io.github.reandroid:ARSCLib:1.4.0'
    implementation 'com.android.tools.build:apksig:8.7.2'

    testImplementation 'junit:junit:4.13.2'
}

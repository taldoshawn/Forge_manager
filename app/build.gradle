plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.forgemanager.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.forgemanager.app'
        minSdk = 26
        targetSdk = 37
        versionCode = 7
        versionName = '0.5.0'
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Local, authorized reverse-engineering workflow: DEX <-> smali.
    implementation 'org.smali:baksmali:2.5.2'
    implementation 'org.smali:smali:2.5.2'
    implementation 'org.smali:dexlib2:2.5.2'

    // Official Android APK signature implementation (v1/v2/v3/v4 + idsig).
    implementation 'com.android.tools.build:apksig:9.4.0'

    testImplementation 'junit:junit:4.13.2'
}
